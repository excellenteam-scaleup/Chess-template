name: Build & Lint

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    name: Linux (GCC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ clang-tidy

      - name: Configure
        run: cmake -S . -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: clang-tidy
        run: |
          find src include -name "*.cpp" -o -name "*.h" | \
            grep -v Chess.cpp | grep -v Chess.h | \
            xargs -r clang-tidy -p build --warnings-as-errors="*"

